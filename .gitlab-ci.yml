stages:
  - lint
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  OVERWRITE:
    value: "false"
    description: "Régénérer tous les hashes sans réutiliser les fichiers de la release précédente"

default:
  image: python:3.14

.python_setup: &python_setup
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install .

# Les pipelines planifiés ne servent qu'à régénérer la base de hashes :
# ni lint ni tests n'y sont exécutés.
.skip_on_schedule: &skip_on_schedule
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Régénération de la base : planifiée, manuelle, ou quand la liste des
# technologies change sur la branche par défaut.
.release_rules: &release_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/tech_list.json

cache:
  key: pip-cache
  paths:
    - .pip-cache/

# ---------- Lint ----------

pylint:
  stage: lint
  <<: [*python_setup, *skip_on_schedule]
  script:
    - pip install pylint pytest
    - pylint --rcfile=.pylintrc hashtheplanet tests

# ---------- Tests ----------

test:
  stage: test
  <<: [*python_setup, *skip_on_schedule]
  script:
    - pip install pytest pytest-cov
    - pytest --cov=hashtheplanet tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

integration:
  stage: test
  <<: [*python_setup, *skip_on_schedule]
  script:
    - echo '{"git":{"targets":["https://github.com/jashkenas/underscore.git"]},"npm":{"targets":["underscore"]}}' > tech.json
    - hashtheplanet --input ./tech.json --json-dir output/
    - ls -la output/
  artifacts:
    paths:
      - output/
    expire_in: 1 week

# ---------- Build ----------

generate_hash_files:
  stage: build
  <<: [*python_setup, *release_rules]
  # Ne dépend d'aucun artefact des étapes précédentes.
  dependencies: []
  timeout: 3h
  cache:
    - key: pip-cache
      paths:
        - .pip-cache/
    - key: git-repos
      paths:
        - .git-cache/
  script:
    - mkdir -p dist/
    - |
      if [ "$OVERWRITE" != "true" ]; then
        echo "Récupération des fichiers JSON du dernier build réussi..."
        if curl -sSfL --remove-on-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o previous.zip \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_DEFAULT_BRANCH}/download?job=${CI_JOB_NAME}"; then
          python -m zipfile -e previous.zip .
          rm -f previous.zip
          ls -la dist/
        else
          echo "Aucun artefact précédent disponible : génération complète."
        fi
      fi
    - hashtheplanet --input src/tech_list.json --json-dir dist/ --cache-dir .git-cache --workers 4
    # Transmis au job de release : `tag_name` n'interprète pas le shell.
    - |
      {
        echo "RELEASE_TAG=${CI_COMMIT_SHORT_SHA}-$(date +%Y-%m-%d)"
        echo "RELEASE_DATE=$(date +%Y-%m-%d)"
        echo "HASH_JOB_ID=${CI_JOB_ID}"
      } > release.env
  artifacts:
    paths:
      - dist/*_hash_files.json
    reports:
      dotenv: release.env
    expire_in: never

# ---------- Release ----------

release_hash_files:
  stage: release
  # `release:` a besoin de glab (ou release-cli), absents de l'image python.
  image:
    name: registry.gitlab.com/gitlab-org/cli:latest
    entrypoint: [""]
  <<: *release_rules
  variables:
    GIT_STRATEGY: none
  cache: []
  needs:
    - job: generate_hash_files
      artifacts: true
  script:
    - echo "Publication de la release $RELEASE_TAG"
  release:
    tag_name: "$RELEASE_TAG"
    ref: "$CI_COMMIT_SHA"
    name: "Hash files release: $RELEASE_DATE"
    description: "Fichiers de hashes générés le $RELEASE_DATE depuis $CI_COMMIT_SHORT_SHA."
    assets:
      links:
        - name: "Fichiers de hashes (archive ZIP)"
          url: "${CI_PROJECT_URL}/-/jobs/${HASH_JOB_ID}/artifacts/download"
          link_type: "package"
        - name: "Fichiers de hashes (parcourir)"
          url: "${CI_PROJECT_URL}/-/jobs/${HASH_JOB_ID}/artifacts/browse/dist"
          link_type: "other"
